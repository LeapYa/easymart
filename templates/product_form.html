{% extends "base.html" %}

{% block title %}商品管理 - 编辑表单{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <a href="/seller/products" style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        返回商品管理
    </a>

    <h1 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem; background: linear-gradient(135deg, #ff5000 0%, #ff0036 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        {% if product %}编辑商品{% else %}添加新商品{% endif %}
    </h1>
    
    <form action="{% if product %}/seller/products/edit/{{ product.id }}{% else %}/seller/products/add{% endif %}" method="POST">
        <div class="form-group">
            <label class="form-label" for="name">
                <span class="required-star">*</span> 商品名称
            </label>
            <input type="text" id="name" name="name" class="form-control" placeholder="请输入商品名称，长度 2-50 位" value="{{ product.name if product else '' }}" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="category">
                商品分类 <span class="required-star">*</span>
            </label>
            <input type="text" id="category" name="category" class="form-control" placeholder="请输入商品分类，如 Electronics, Clothing 等" value="{{ product.category if product else '' }}" required>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label" for="price">
                    <span class="required-star">*</span> 价格 (元)
                </label>
                <input type="number" id="price" name="price" class="form-control" placeholder="0.01 - 999999.99" value="{{ product.price if product else '' }}" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="stock">
                    库存 (件) <span class="required-star">*</span>
                </label>
                <input type="number" id="stock" name="stock" class="form-control" placeholder="0 - 99999" value="{{ product.stock if product else '' }}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="image_url">商品图片 URL</label>
            <input type="url" id="image_url" name="image_url" class="form-control" placeholder="请输入商品网络图片 URL (可空，将使用预置默认图)" value="{{ product.image_url if product else '' }}">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="description">商品描述</label>
            <textarea id="description" name="description" class="form-control" placeholder="请输入详细的商品介绍信息" rows="4" style="resize: vertical;">{{ product.description if product else '' }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">确认</button>
    </form>
</div>
{% endblock %}
